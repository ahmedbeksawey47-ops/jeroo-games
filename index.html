<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiro Meet & Chat - منصة المحادثات والاجتماعات</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PeerJS for Instant Real-Time Video & Audio Connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --wa-green: #075e54;
            --wa-light-green: #25d366;
            --wa-bubble-out: #056162;
            --wa-bubble-in: #262d31;
            --meet-red: #ea4335;
            --meet-blue: #1a73e8;
            --text-color: #e9edef;
            --text-muted: #8696a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .brand i {
            color: var(--meet-blue);
            font-size: 1.5rem;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #2a2a2a;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .room-code {
            font-family: monospace;
            font-size: 0.95rem;
            color: var(--wa-light-green);
        }

        .btn-copy {
            background: #1a73e8;
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-copy:hover {
            background: #1557b0;
        }

        main {
            flex: 1;
            display: flex;
            height: calc(100vh - 135px);
            position: relative;
        }

        .video-container {
            flex: 1;
            background-color: #000;
            position: relative;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            padding: 15px;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 250px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #1a1a1a;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-placeholder {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: var(--text-muted);
        }

        .user-tag {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-sidebar {
            width: 360px;
            background-color: #111b21;
            border-right: 1px solid #222d34;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .chat-sidebar.collapsed {
            display: none;
        }

        .chat-header {
            background-color: var(--panel-bg);
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222d34;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-image: radial-gradient(#202c33 1px, transparent 0);
            background-size: 24px 24px;
        }

        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
        }

        .message.sent {
            align-self: flex-start;
            background-color: var(--wa-bubble-out);
            color: #e9edef;
        }

        .message.received {
            align-self: flex-end;
            background-color: var(--wa-bubble-in);
            color: #e9edef;
        }

        .message .time {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.6);
            margin-top: 4px;
            display: block;
        }

        .chat-input-area {
            background-color: var(--panel-bg);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background-color: #2a3942;
            border: none;
            outline: none;
            padding: 10px 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
        }

        .btn-send, .btn-file {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .btn-send {
            color: var(--wa-light-green);
        }

        footer {
            height: 75px;
            background-color: var(--panel-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-top: 1px solid #2a2a2a;
        }

        .controls-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background-color: #3c4043;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .control-btn.active-off {
            background-color: var(--meet-red);
        }

        .btn-end-call {
            background-color: var(--meet-red);
            width: 56px;
            height: 48px;
            border-radius: 24px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-video"></i>
            <span>Jiro Meet & Chat</span>
        </div>

        <div class="room-info">
            <span>رمز الغرفة:</span>
            <span class="room-code" id="roomCode">جاري التجهيز...</span>
            <button class="btn-copy" onclick="copyInviteLink()">
                <i class="fa-regular fa-copy"></i>
                <span>نسخ رابط الدعوة</span>
            </button>
        </div>
    </header>

    <main>
        <section class="video-container" id="videoContainer">
            <div class="video-wrapper" id="localWrapper">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-placeholder" id="videoPlaceholder">
                    <i class="fa-solid fa-user-slash" style="font-size: 3rem;"></i>
                    <span>الكاميرا مغلقة</span>
                </div>
                <div class="user-tag">
                    <i class="fa-solid fa-microphone-slash" id="micStatusIcon" style="color: #ea4335;"></i>
                    <span>أنت (المستضيف)</span>
                </div>
            </div>
        </section>

        <aside class="chat-sidebar" id="chatSidebar">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:8px;">
                    <i class="fa-brands fa-whatsapp" style="color:var(--wa-light-green);"></i>
                    <span>محادثة الاجتماع</span>
                </div>
                <button style="background:none; border:none; color:#fff; cursor:pointer;" onclick="toggleChat()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message sent">
                    مرحباً بك! قم بنسخ رابط الدعوة وإرساله لأصدقائك للانضمام فوراً. 🚀
                    <span class="time">الآن</span>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="اكتب رسالة..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </aside>
    </main>

    <footer>
        <div style="color: var(--text-muted);" id="clock">--:--</div>

        <div class="controls-center">
            <button class="control-btn active-off" id="micBtn" onclick="toggleMic()" title="المايك">
                <i class="fa-solid fa-microphone-slash"></i>
            </button>
            <button class="control-btn active-off" id="camBtn" onclick="toggleCam()" title="الكاميرا">
                <i class="fa-solid fa-video-slash"></i>
            </button>
            <button class="control-btn" onclick="toggleScreenShare()" title="مشاركة الشاشة">
                <i class="fa-solid fa-desktop"></i>
            </button>
            <button class="control-btn btn-end-call" onclick="endCall()" title="مغادرة">
                <i class="fa-solid fa-phone-slash"></i>
            </button>
        </div>

        <div>
            <button class="control-btn" onclick="toggleChat()" title="المحادثة">
                <i class="fa-solid fa-message"></i>
            </button>
        </div>
    </footer>

    <script>
        let peer = null;
        let conn = null;
        let localStream = null;
        let isMicOn = false;
        let isCamOn = false;

        const urlParams = new URLSearchParams(window.location.search);
        const targetPeerId = urlParams.get('room');

        // Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        // Initialize WebRTC Peer
        function initPeer() {
            peer = new Peer();

            peer.on('open', (id) => {
                document.getElementById('roomCode').innerText = id;
                if (targetPeerId) {
                    connectToPeer(targetPeerId);
                }
            });

            // Receive incoming call
            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    addRemoteVideo(remoteStream);
                });
            });

            // Receive incoming chat connection
            peer.on('connection', (connection) => {
                conn = connection;
                setupChatConnection();
            });
        }

        async function initStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                localStream.getAudioTracks().forEach(t => t.enabled = isMicOn);
                localStream.getVideoTracks().forEach(t => t.enabled = isCamOn);
            } catch (err) {
                console.warn("إذن الكاميرا/المايك لم يمنح بعد:", err);
            }
        }

        function connectToPeer(remoteId) {
            conn = peer.connect(remoteId);
            setupChatConnection();

            if (localStream) {
                const call = peer.call(remoteId, localStream);
                call.on('stream', (remoteStream) => {
                    addRemoteVideo(remoteStream);
                });
            }
        }

        function setupChatConnection() {
            conn.on('data', (data) => {
                appendMessage(data, 'received');
            });
            conn.on('open', () => {
                appendSystemMessage("انضم صديق جديد للاجتماع الآن! 🎉");
            });
        }

        function addRemoteVideo(remoteStream) {
            if (document.getElementById('remoteVideo')) return;

            const videoContainer = document.getElementById('videoContainer');
            const wrapper = document.createElement('div');
            wrapper.className = 'video-wrapper';
            wrapper.id = 'remoteWrapper';

            const video = document.createElement('video');
            video.id = 'remoteVideo';
            video.autoplay = true;
            video.playsInline = true;
            video.srcObject = remoteStream;

            const tag = document.createElement('div');
            tag.className = 'user-tag';
            tag.innerHTML = `<span>مشارك آخر</span>`;

            wrapper.appendChild(video);
            wrapper.appendChild(tag);
            videoContainer.appendChild(wrapper);
        }

        async function toggleMic() {
            isMicOn = !isMicOn;
            if (!localStream) await initStream();
            if (localStream && localStream.getAudioTracks()[0]) {
                localStream.getAudioTracks()[0].enabled = isMicOn;
            }
            const btn = document.getElementById('micBtn');
            const icon = document.getElementById('micStatusIcon');
            if (isMicOn) {
                btn.classList.remove('active-off');
                btn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
                icon.className = 'fa-solid fa-microphone';
                icon.style.color = '#25d366';
            } else {
                btn.classList.add('active-off');
                btn.innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';
                icon.className = 'fa-solid fa-microphone-slash';
                icon.style.color = '#ea4335';
            }
        }

        async function toggleCam() {
            isCamOn = !isCamOn;
            if (!localStream) await initStream();
            if (localStream && localStream.getVideoTracks()[0]) {
                localStream.getVideoTracks()[0].enabled = isCamOn;
            }
            const btn = document.getElementById('camBtn');
            const placeholder = document.getElementById('videoPlaceholder');
            if (isCamOn) {
                btn.classList.remove('active-off');
                btn.innerHTML = '<i class="fa-solid fa-video"></i>';
                placeholder.style.display = 'none';
            } else {
                btn.classList.add('active-off');
                btn.innerHTML = '<i class="fa-solid fa-video-slash"></i>';
                placeholder.style.display = 'flex';
            }
        }

        function copyInviteLink() {
            const peerId = document.getElementById('roomCode').innerText;
            const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${peerId}`;
            navigator.clipboard.writeText(inviteUrl);
            alert("تم نسخ رابط الدعوة! ابعته لصاحبك أول ما يدوس عليه هيدخل معاك على طول:\n" + inviteUrl);
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'sent');
            if (conn && conn.open) {
                conn.send(text);
            }
            input.value = '';
        }

        function appendMessage(text, type) {
            const messages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            msgDiv.innerHTML = `${text}<span class="time">${time}</span>`;
            messages.appendChild(msgDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function appendSystemMessage(text) {
            const messages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.style.textAlign = 'center';
            msgDiv.style.fontSize = '0.8rem';
            msgDiv.style.color = '#25d366';
            msgDiv.style.margin = '8px 0';
            msgDiv.innerText = text;
            messages.appendChild(msgDiv);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function toggleChat() {
            document.getElementById('chatSidebar').classList.toggle('collapsed');
        }

        function endCall() {
            if (confirm("هل تريد مغادرة الاجتماع؟")) {
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                location.reload();
            }
        }

        initPeer();
        initStream();
    </script>
</body>
</html>
